# Local stack: Postgres `db` + SvelteKit `app` (upload API).
name: pack-tech-challenge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # In-compose hostname is the Compose service name `db` (ADR 0002).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${APP_PORT:-3000}
      FILE_STORAGE_ROOT: /data/file-store
      NODE_ENV: production
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - app_files:/data/file-store
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_files:
