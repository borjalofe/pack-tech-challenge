# Fly.io app wiring (#47 / ADR 0006). Live URL verified in #48:
# https://pack-tech-challenge.fly.dev

app = 'pack-tech-challenge'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    # CSRF: must match the public browser origin.
    ORIGIN = 'https://pack-tech-challenge.fly.dev'

[deploy]
  # Schema + form catalogs only. Never set SEED_DEMO_DATA on Fly.
  # Requires ENTRYPOINT arg passthrough (see scripts/docker-entrypoint.sh).
  release_command = '/fly-release.sh'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  FILE_STORAGE_ROOT = '/data/file-store'
  # SEED_DEMO_DATA intentionally unset — production table stays empty of fixtures.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Local FS blobs until Epic #25. Create once: fly volumes create pack_files --region fra --size 1
[mounts]
  source = 'pack_files'
  destination = '/data/file-store'
